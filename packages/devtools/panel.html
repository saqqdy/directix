<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Directix Inspector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 12px; color: #333; background: #fff; }
        .header { padding: 8px 12px; border-bottom: 1px solid #e0e0e0; background: #f5f5f5; display: flex; align-items: center; gap: 8px; }
        .header h2 { font-size: 13px; font-weight: 600; }
        .tabs { display: flex; border-bottom: 1px solid #e0e0e0; }
        .tab { padding: 6px 12px; cursor: pointer; border: none; background: none; font-size: 11px; color: #666; }
        .tab.active { color: #1a73e8; border-bottom: 2px solid #1a73e8; }
        .content { padding: 12px; }
        .directive-item { padding: 8px; border: 1px solid #e0e0e0; border-radius: 4px; margin-bottom: 8px; }
        .directive-name { font-weight: 600; color: #1a73e8; }
        .directive-value { color: #666; margin-top: 4px; }
        .directive-state { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; }
        .state-active { background: #e6f4ea; color: #137333; }
        .state-inactive { background: #fce8e6; color: #c5221f; }
        .empty-state { text-align: center; padding: 40px; color: #999; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
        .stat-card { padding: 8px; background: #f5f5f5; border-radius: 4px; }
        .stat-value { font-size: 18px; font-weight: 700; color: #1a73e8; }
        .stat-label { font-size: 10px; color: #666; }
    </style>
</head>
<body>
    <div class="header">
        <h2>🔍 Directix Inspector</h2>
    </div>
    <div class="tabs">
        <button class="tab active" data-tab="directives">Directives</button>
        <button class="tab" data-tab="performance">Performance</button>
    </div>
    <div class="content" id="directives-panel">
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="active-count">0</div>
                <div class="stat-label">Active Directives</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="element-count">0</div>
                <div class="stat-label">Bound Elements</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="memory-usage">0KB</div>
                <div class="stat-label">Memory Usage</div>
            </div>
        </div>
        <div id="directive-list">
            <div class="empty-state">
                Select an element to inspect its directives
            </div>
        </div>
    </div>
    <div class="content" id="performance-panel" style="display:none">
        <div class="empty-state">
            Performance metrics will appear when directives are active
        </div>
    </div>
    <script src="panel.js"></script>
</body>
</html>
