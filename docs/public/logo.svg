<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42b883"/>
      <stop offset="100%" style="stop-color:#35495e"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="20" y="20" width="160" height="160" rx="32" fill="url(#bgGrad)"/>

  <!-- Regular hexagon - 6 vertices at 60° intervals, centered at 100,100 -->
  <!-- radius=65, starting from top (270° or -90°) -->
  <polygon points="100,35 156.29,67.5 156.29,132.5 100,165 43.71,132.5 43.71,67.5"
           fill="none"
           stroke="white"
           stroke-width="4"
           stroke-linejoin="round"/>

  <!-- Inner regular hexagon - radius=48 -->
  <polygon points="100,52 141.57,76 141.57,124 100,148 58.43,124 58.43,76"
           fill="white"
           opacity="0.15"/>

  <!-- Target crosshair in center - perfect circles -->
  <circle cx="100" cy="100" r="22" fill="none" stroke="white" stroke-width="3"/>
  <circle cx="100" cy="100" r="8" fill="white"/>

  <!-- Target lines -->
  <line x1="100" y1="73" x2="100" y2="83" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="117" x2="100" y2="127" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="73" y1="100" x2="83" y2="100" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="117" y1="100" x2="127" y2="100" stroke="white" stroke-width="3" stroke-linecap="round"/>
</svg>